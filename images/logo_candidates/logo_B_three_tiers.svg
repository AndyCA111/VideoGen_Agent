<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="VideoGen-Agent">
  <!-- 3 stacked tool-tier chevrons (augment / generate / verify) forming a play arrow silhouette -->
  <g stroke-linejoin="round" stroke-linecap="round" stroke-width="0">
    <!-- Augmentation (green, leftmost chevron) -->
    <polygon points="18,26 48,50 18,74" fill="#3FA838"/>
    <!-- Generation (chartreuse, middle chevron) -->
    <polygon points="38,26 68,50 38,74" fill="#9FC72E"/>
    <!-- Verification (warm yellow, rightmost chevron / point of the play arrow) -->
    <polygon points="58,26 88,50 58,74" fill="#F0CB1F"/>
  </g>
  <!-- Tiny agent-eye dot at the top-left, hinting at the multimodal policy -->
  <circle cx="14" cy="18" r="4" fill="#2c3a4a"/>
</svg>
