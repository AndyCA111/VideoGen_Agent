<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="VideoGen-Agent">
  <defs>
    <linearGradient id="gradD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3FA838"/>
      <stop offset="100%" stop-color="#F0CB1F"/>
    </linearGradient>
  </defs>
  <!-- Video frame (4:3 rounded rect) -->
  <rect x="10" y="20" width="80" height="60" rx="8" ry="8"
        fill="none" stroke="url(#gradD)" stroke-width="6"/>
  <!-- Play arrow inside the frame -->
  <polygon points="40,36 40,64 66,50" fill="#3FA838"/>
  <!-- Three agent action dots on the top edge (tools the agent invokes) -->
  <circle cx="30" cy="20" r="5" fill="#6FB833"/>
  <circle cx="50" cy="14" r="5" fill="#9FC72E"/>
  <circle cx="70" cy="20" r="5" fill="#F0CB1F"/>
  <!-- Short connecting lines dot → frame -->
  <path d="M 30 22 L 30 26 M 50 16 L 50 22 M 70 22 L 70 26"
        stroke="#6FB833" stroke-width="2" stroke-linecap="round"/>
</svg>
