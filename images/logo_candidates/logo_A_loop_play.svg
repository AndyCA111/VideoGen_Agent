<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="VideoGen-Agent">
  <defs>
    <linearGradient id="gradA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3FA838"/>
      <stop offset="33%" stop-color="#6FB833"/>
      <stop offset="66%" stop-color="#CFD629"/>
      <stop offset="100%" stop-color="#F0CB1F"/>
    </linearGradient>
  </defs>
  <!-- Agentic loop arc: three-quarters of a circle + arrowhead, sweeping clockwise around the play -->
  <path d="M 82 24 A 40 40 0 1 1 24 70"
        fill="none" stroke="url(#gradA)" stroke-width="9" stroke-linecap="round"/>
  <!-- Arrowhead at the top-right end of the loop -->
  <polygon points="82,10 96,26 68,26" fill="#3FA838"/>
  <!-- Play triangle (video generation) at centre -->
  <polygon points="41,32 41,68 72,50" fill="#F0CB1F" stroke="#3FA838" stroke-width="3" stroke-linejoin="round"/>
</svg>
