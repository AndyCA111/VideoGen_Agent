<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="VideoGen-Agent">
  <defs>
    <linearGradient id="gradC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3FA838"/>
      <stop offset="50%" stop-color="#9FC72E"/>
      <stop offset="100%" stop-color="#F0CB1F"/>
    </linearGradient>
  </defs>
  <!-- Rounded-square badge -->
  <rect x="4" y="4" width="92" height="92" rx="18" ry="18" fill="url(#gradC)"/>
  <!-- Big "V" formed by two thick strokes (Video) -->
  <path d="M 22 28 L 42 72 L 62 28" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Small "A" stacked to the right of the V (Agent) — realized as a triangle -->
  <path d="M 58 72 L 70 40 L 82 72 M 63 60 L 77 60" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
